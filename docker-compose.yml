services:
  # Local Postgres only. Published on 127.0.0.1 so it is not reachable from the network.
  # Passwords match .env.example. Change both before this machine is shared.
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: mpos
      POSTGRES_PASSWORD: mpos-local-dev
      POSTGRES_DB: mpos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpos -d mpos"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname=127.0.0.1
      - --hostname-strict=false
      - --hostname-port=8080
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
