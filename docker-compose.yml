# The publisher and its Postgres. Both are published on 127.0.0.1 only; put a
# TLS reverse proxy in front for a public address (see docs/deploy.md).
# Credentials come from .env (scripts/init-env.sh). Postgres reads the password
# only when this volume is first created.
#
#   docker compose up -d --build     # app + Postgres
#   docker compose up -d postgres    # Postgres only, for npm start during development
services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run scripts/init-env.sh)}
      POSTGRES_DB: ${POSTGRES_DATABASE:-mpos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Uses the same .env, but reaches Postgres by its service name and listens on
  # all interfaces inside the container. Port 3000 is still published on 127.0.0.1 only.
  app:
    build: .
    image: mcpencode:local
    init: true
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Compose's private network, not the internet. Use POSTGRES_SSL=required for a remote database.
      POSTGRES_SSL: disable
      BIND_HOST: 0.0.0.0
      PORT: "3000"
      # A reverse proxy on the host reaches the container from the Docker bridge
      # (a private address), so trust X-Forwarded-For from private addresses only.
      # Set TRUST_PROXY in .env to change it (e.g. false with no proxy in front).
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
